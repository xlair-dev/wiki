baseURL: https://wiki.xlair.dev/
title: XLAIR Wiki
locale: ja

module:
  imports:
    - path: github.com/imfing/hextra

enableRobotsTXT: true
enableGitInfo: true
hasCJKLanguage: true

outputs:
  home: [html, llms]
  page: [html, markdown]
  section: [html, rss, markdown]

# defaultContentLanguage: ja
# languages:
#   ja:
#     label: 日本語
#     locale: ja-JP
#     weight: 1
#     title: XLAIR Wiki
#   en:
#     label: English
#     weight: 2
#     title: XLAIR Wiki

enableInlineShortcodes: true

menu:
  main:
    - name: 検索
      params:
        type: search
      weight: 1
    - name: GitHub
      url: "https://github.com/xlair-dev"
      params:
        icon: github
      weight: 2
    - name: Theme Toggle
      params:
        type: theme-toggle
      weight: 3
  sidebar:
    - name: その他
      params:
        type: separator
      weight: 1
    - name: "公式サイト ↗"
      url: "https://xlair.dev"
      weight: 2

params:
  description: 音楽ゲーム XLAIR の公式 Wiki です。
  externalLinkDecoration: true
  navbar:
    displayTitle: true
    displayLogo: false
    logo:
      path: images/logo.svg
      dark: images/logo-dark.svg
      link: /
      width: 40
      height: 20
  editURL:
    enable: true
    base: "https://github.com/xlair-dev/wiki/edit/main/content"
  theme:
    default: system
    displayToggle: true
  footer:
    enable: true
    displayCopyright: false
    displayPoweredBy: false
    width: normal
  displayUpdatedDate: true
  dateFormat: "2006年1月2日"
  displayUpdatedAuthor: true
  imageZoom:
    enable: true
